<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo sites | Agentic Services</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#fafaf9;color:#0e1116;font-family:'Work Sans',sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:22px 20px}
    .logo{font:700 22px 'Outfit',sans-serif;text-decoration:none;color:inherit}.logo span{color:#22c55e}
    .back{font-size:14px;color:#16a34a;text-decoration:none;font-weight:500}
    main{max-width:1100px;margin:0 auto;padding:20px 20px 80px}
    h1{font:700 clamp(34px,5vw,56px)/1.05 'Outfit',sans-serif;margin:30px 0 12px;letter-spacing:-.02em}
    p.sub{color:#5b6270;font-size:18px;max-width:560px;margin:0 0 30px}
    input{width:100%;max-width:420px;height:48px;padding:0 16px;border:1px solid #d9dce1;border-radius:12px;font:inherit;font-size:16px;margin-bottom:28px;outline:none}
    input:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
    .card{display:flex;flex-direction:column;gap:6px;padding:22px;background:#fff;border:1px solid #e6e8eb;border-radius:18px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
    .card:hover{transform:translateY(-3px);border-color:#22c55e;box-shadow:0 18px 40px -22px rgba(14,17,22,.35)}
    .card b{font:600 21px 'Outfit',sans-serif}.card span{color:#5b6270;font-size:14px}
    .card i{font-style:normal;margin-top:10px;font-size:13px;font-weight:600;color:#16a34a}
    .none{color:#5b6270}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">Agentic<span>Services</span></a>
    <a class="back" href="/">← Back to site</a>
  </header>
  <main>
    <h1>Demo sites</h1>
    <p class="sub">Concept websites we've built for Irish businesses: online ordering, bookings, vouchers and more.</p>
    <input id="q" type="search" placeholder="Search by business, type or area…" aria-label="Search demo sites">
    <div class="grid" id="grid"></div>
  </main>
  <script src="/js/showcase-sites.js"></script>
  <script>
    const S = window.AGENTIC_SHOWCASE || [], g = document.getElementById('grid'), q = document.getElementById('q');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function draw() {
      const t = q.value.trim().toLowerCase();
      const h = S.filter(s => !t || (s.name+' '+s.type+' '+s.place+' '+s.tags).toLowerCase().includes(t));
      g.innerHTML = h.length ? h.map(s => `<a class="card" href="${esc(s.url)}"><b>${esc(s.name)}</b><span>${esc(s.type)}</span><span>${esc(s.place)}</span><i>View demo →</i></a>`).join('') : '<p class="none">No demos match that search.</p>';
    }
    q.addEventListener('input', draw); draw();
  </script>
</body>
</html>
